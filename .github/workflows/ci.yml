name: MoonWitness Pocket CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run unit tests
        run: bun test

  android-debug-apk:
    needs: typecheck-and-test
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4096m
        -Dkotlin.daemon.jvm.options=-Xmx3072m
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk: 26.1.10909125
      - uses: oven-sh/setup-bun@v2
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: ${{ runner.os }}-gradle-${{ hashFiles('bun.lock', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"
          sdkmanager --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Expo Android prebuild
        run: bunx expo prebuild --platform android --clean --no-install
      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace --max-workers=2
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mw-pocket-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
